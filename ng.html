<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ご応募ありがとうございました｜AIエージェント 個別面談</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .shine-btn{position:relative;overflow:hidden}
  .shine-btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;pointer-events:none;
    background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.45) 50%,transparent 100%);
    transform:skewX(-20deg) translateX(-250%);animation:shine 3.4s ease-in-out infinite}
  .shine-btn:hover{box-shadow:0 0 26px rgba(246,201,69,.6)}
  @keyframes shine{0%{transform:skewX(-20deg) translateX(-250%)}55%,100%{transform:skewX(-20deg) translateX(450%)}}
</style>
</head>
<body class="bg-[#080b14] text-white" style="font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;">
  <main class="min-h-screen flex items-center justify-center px-5"
        style="background:radial-gradient(120% 80% at 50% 0%,#1c3a78 0%,#13294f 30%,#0b1730 60%,#080b14 100%);">
    <div class="max-w-xl w-full text-center py-16">
      <div class="text-6xl mb-4">🙏</div>
      <p class="inline-block text-sm tracking-widest text-white/70 border border-white/30 rounded-full px-4 py-1 mb-6">ご応募ありがとうございました</p>
      <h1 class="text-2xl sm:text-4xl font-black leading-tight mb-5">
        今回はご応募<br class="sm:hidden" />ありがとうございました
      </h1>
      <p class="text-white/85 leading-relaxed mb-8 text-sm sm:text-base">
        誠に申し訳ございませんが、今回は<b class="text-white">個別面談の対象外</b>とさせていただきました。<br />
        タイミングが合いましたら、<b style="color:#f6c945">次回ぜひ大和ViSionでお会いしましょう。</b>
      </p>

      <a href="https://www.yamatovision.jp/index.html"
         class="shine-btn inline-block bg-[#f6c945] text-[#0a0e1a] font-black text-lg sm:text-xl rounded-xl px-9 py-4 hover:brightness-105 transition">
        大和ViSionを見てみる
      </a>

      <p class="text-white/45 text-xs mt-6">まもなく大和ViSionのページへ移動します。移動しない場合は上のボタンを押してください。</p>
    </div>
  </main>
  <script>
    setTimeout(function(){ window.location.href = "https://www.yamatovision.jp/index.html"; }, 4500);
  </script>
</body>
</html>
