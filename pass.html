<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>審査通過のご案内｜AIエージェント 個別面談</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .shine-btn{position:relative;overflow:hidden}
  .shine-btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;pointer-events:none;
    background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);
    transform:skewX(-20deg) translateX(-250%);animation:shine 3.2s ease-in-out infinite}
  .shine-btn:hover{box-shadow:0 0 26px rgba(6,199,85,.8),0 0 8px rgba(6,199,85,.6)}
  @keyframes shine{0%{transform:skewX(-20deg) translateX(-250%)}55%,100%{transform:skewX(-20deg) translateX(450%)}}
</style>
</head>
<body class="bg-[#080b14] text-white" style="font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;">
  <main class="min-h-screen flex items-center justify-center px-5"
        style="background:radial-gradient(120% 80% at 50% 0%,#2a52a8 0%,#1c3a78 22%,#0d1c44 55%,#080b14 100%);">
    <div class="max-w-xl w-full text-center py-16">
      <div class="text-6xl mb-4" style="color:#f6c945">🎉</div>
      <p class="inline-block text-sm tracking-widest text-[#f6c945] border border-[#f6c945]/40 rounded-full px-4 py-1 mb-6">審査通過のご案内</p>
      <h1 class="text-2xl sm:text-4xl font-black leading-tight mb-5">
        審査<span style="color:#f6c945">通過</span>おめでとうございます！
      </h1>
      <p class="text-white/85 leading-relaxed mb-2 text-sm sm:text-base">
        このたびは個別面談にお申し込みいただきありがとうございます。<br />
        下記より、<b class="text-white">面談の日程をご予約ください。</b>
      </p>
      <p class="text-xs text-white/55 mb-8">完全予約制／先着順／お一人様1回まで</p>

      <a href="https://ex-pa.jp/item/61094"
         class="shine-btn inline-block bg-[#06c755] text-white font-black text-xl sm:text-2xl rounded-xl px-10 py-5 shadow-lg shadow-[#06c755]/40 hover:brightness-110 transition">
        日程を予約する
      </a>

      <p class="text-white/45 text-xs mt-6">まもなく予約ページへ移動します。移動しない場合は上のボタンを押してください。</p>
    </div>
  </main>
  <script>
    setTimeout(function(){ window.location.href = "https://ex-pa.jp/item/61094"; }, 8000);
  </script>
</body>
</html>
